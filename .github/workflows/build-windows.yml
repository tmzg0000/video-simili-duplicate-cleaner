name: Build Windows App

on:
  workflow_dispatch: 
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1. 启动 vcpkg，利用缓存避免重新编译
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'

      # 2. 运行 CMake 配置
      - name: Configure CMake
        run: >
          cmake -B build -S QtProject 
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" 
          -DCMAKE_BUILD_TYPE=Release

      # 3. 执行正式编译
      - name: Build executable
        run: cmake --build build --config Release

      # 4. [终极绝杀] 暴力拷贝 vcpkg 编译出的所有 DLL 和 Qt 插件
      - name: Deploy all dependencies manually
        run: |
          cd build
          
          # 拷贝所有的核心 DLL (包含 FFmpeg, OpenCV, Qt6Core 等)
          Copy-Item -Path "vcpkg_installed\x64-windows\bin\*.dll" -Destination "Release\" -Force
          
          # 拷贝所有的 Qt 插件目录 (包含 platforms\qwindows.dll, imageformats 等) 到 Release 目录下
          Copy-Item -Path "vcpkg_installed\x64-windows\plugins\*" -Destination "Release\" -Recurse -Force

      # 5. 打包整个文件夹
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Video-Simili-Duplicate-Cleaner-Windows
          path: build/Release/
          if-no-files-found: warn
