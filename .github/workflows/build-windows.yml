name: Build Windows App

on:
  workflow_dispatch: 
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1. 配置 Qt 环境 (GitHub Actions 默认无 Qt)
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3' # 使用稳定的 Qt6 版本
          arch: 'win64_msvc2019_64' # MSVC 2019 的预编译包完全兼容 VS 2022

      # 2. 配置 vcpkg 并启用强缓存 (极其重要！)
      # 这一步能大幅加速后续编译，避免每次都从头编译 FFmpeg 和 OpenCV
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'

# 3. 运行 CMake 配置，显式指定源码目录为 QtProject
      - name: Configure CMake
        run: >
          cmake -B build -S QtProject 
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" 
          -DCMAKE_BUILD_TYPE=Release

# 4. 执行正式编译
      - name: Build executable
        run: cmake --build build --config Release

      # 5. [新增] 运行 windeployqt 自动收集 Qt 依赖和插件文件夹
      - name: Deploy Qt dependencies
        run: windeployqt --release build/Release/video-simili-duplicate-cleaner.exe

      # 6. [修改] 打包整个 Release 文件夹（包含 platforms 等子目录）
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Video-Simili-Duplicate-Cleaner-Windows
          path: build/Release/
          if-no-files-found: warn
