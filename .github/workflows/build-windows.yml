name: Build Windows App

on:
  workflow_dispatch: 
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1. 启动 vcpkg，利用缓存避免重新编译
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'

      # 2. 运行 CMake 配置
      - name: Configure CMake
        run: >
          cmake -B build -S QtProject 
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" 
          -DCMAKE_BUILD_TYPE=Release

      # 3. 执行正式编译
      - name: Build executable
        run: cmake --build build --config Release

      # 4. [终极修复版] 智能拷贝与部署依赖
      - name: Deploy all dependencies
        run: |
          cd build
          
          # 第一步：暴力提取 vcpkg 编译的所有基础 DLL (包含缺失的 FFmpeg 和 OpenCV)
          if (Test-Path "vcpkg_installed\x64-windows\bin") {
              Write-Host "Copying core DLLs..."
              Copy-Item -Path "vcpkg_installed\x64-windows\bin\*.dll" -Destination "Release\" -Force
          }
          
          # 第二步：在系统里搜寻 vcpkg 自己编译的纯正版 windeployqt.exe，并用它来提取 Qt 插件
          $windeployqt = Get-ChildItem -Path "vcpkg_installed" -Filter "windeployqt.exe" -Recurse | Select-Object -First 1
          if ($windeployqt) {
              Write-Host "找到纯正血统的 windeployqt: $($windeployqt.FullName)"
              & $windeployqt.FullName --release --compiler-runtime --dir Release Release\video-simili-duplicate-cleaner.exe
          } else {
              Write-Host "Warning: 找不到 windeployqt.exe"
          }

      # 5. 打包整个文件夹
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Video-Simili-Duplicate-Cleaner-Windows
          path: build/Release/
          if-no-files-found: warn
